server:
  port: 8080

spring:
  application:
    name: blade-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLADE_DB_URL:jdbc:mysql://localhost:3306/blade_project?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BLADE_DB_USERNAME:root}
    password: ${BLADE_DB_PASSWORD:root123}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${BLADE_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${BLADE_MULTIPART_MAX_REQUEST_SIZE:220MB}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  tenant-line:
    enabled: true
    tenant-table: sys_user
    ignore-tables:
      - sys_dict
      - sys_param
      - sys_log

jwt:
  secret: ${JWT_SECRET:blade-project-jwt-secret-key-2026}
  expiration: 3600000          # 1 hour
  refresh-expiration: 604800000 # 7 days
  remember-refresh-expiration: 2592000000 # 30 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

blade:
  file:
    storage-type: local
    local-base-path: ${BLADE_FILE_LOCAL_BASE_PATH:uploads}
    preview-url-prefix: /api/files
    max-size-mb: ${BLADE_FILE_MAX_SIZE_MB:200}
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - video/mp4
      - video/webm
      - video/quicktime
    derivative:
      enabled: true
      thumb-long-edge: 320
      card-long-edge: 800
    cleanup:
      enabled: false
      unbound-retention-days: 7
      purge-retention-days: 30
      tenant-id: 1
      cron: 0 0 3 * * ?
