server:
  port: 8080

spring:
  application:
    name: blade-backend-test

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLADE_DB_URL:jdbc:mysql://localhost:3306/blade_project?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BLADE_DB_USERNAME:root}
    password: ${BLADE_DB_PASSWORD:root123}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  tenant-line:
    enabled: true
    tenant-table: sys_user
    ignore-tables:
      - sys_dict
      - sys_param
      - sys_log

jwt:
  secret: blade-project-jwt-secret-key-2026
  expiration: 1800000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
