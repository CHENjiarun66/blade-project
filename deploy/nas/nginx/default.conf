server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/blade.crt;
    ssl_certificate_key /etc/nginx/ssl/blade.key;
    server_name _;

    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;
    error_page 503 @maintenance;

    if (-f /maintenance/enabled) {
        return 503;
    }

    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统维护中</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f8fb;color:#172033}.box{max-width:520px;padding:40px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #17203314}h1{margin:0 0 12px}p{line-height:1.7;color:#5d6778}</style><div class="box"><h1>系统升级中</h1><p>订单与商品模块正在维护，请稍后刷新。维护期间不会接收新的订单写入。</p></div></html>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://blade-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
